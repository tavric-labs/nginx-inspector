load_module /opt/inspector/ngx_http_inspector_module.so;
pid /tmp/inspector-nginx.pid;
error_log stderr notice;
worker_processes 1;
events { worker_connections 1024; }
http {
    sendfile on;
    limit_req_zone $binary_remote_addr zone=inspector_rate:1m rate=1r/m;
    client_body_buffer_size 1k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache_path /tmp/inspector_cache keys_zone=inspector_cache:1m max_size=8m inactive=1m;
    upstream inspector_backend { server 127.0.0.1:18081; keepalive 8; }
    upstream inspector_retry { server 127.0.0.1:1 max_fails=0; server 127.0.0.1:18081 backup; }
    access_log off;
    inspector on;
    inspector_control /data/control;
    inspector_port 19876;
    inspector_sample 10000;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 127.0.0.1:18080;
        location / { proxy_pass http://inspector_backend; }
        location = /bandwidth { limit_rate 8k; limit_rate_after 1k; proxy_pass http://inspector_backend; }
        location = /rate-limited { limit_req zone=inspector_rate; proxy_pass http://inspector_backend; }
        location = /streamed { proxy_buffering off; proxy_request_buffering off; proxy_pass http://inspector_backend; }
        location = /no-buffer { proxy_pass http://inspector_backend; }
        location = /retry { proxy_pass http://inspector_retry; }
        location = /cached { proxy_cache inspector_cache; proxy_cache_valid 200 1m; proxy_pass http://inspector_backend/cacheable; }
        location = /compressed { gzip on; gzip_min_length 1; gzip_types text/plain; proxy_pass http://inspector_backend/large; }
        location = /file { alias /data/static-example.txt; }
        location = /auth-check { internal; return 204; }
        location = /with-auth { auth_request /auth-check; proxy_pass http://inspector_backend; }
        location = /small-upload-limit { client_max_body_size 16; proxy_pass http://inspector_backend; }
        location = /local { return 204; }
        location = /disabled { inspector off; return 204; }
        location = /redirect { rewrite ^ /local last; }
        location = /broken { proxy_pass http://127.0.0.1:1; }
    }
}
