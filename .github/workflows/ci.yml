name: inspector
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker compose up --build --detach
      - name: Wait for collector and proxy backend
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19877/health && curl -fsS http://127.0.0.1:18080/; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1
      - run: python3 tests/integration.py
      - run: python3 tests/native_integration.py
      - run: python3 tests/on_demand.py
      - run: python3 tests/equivalence.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:viewer
      - if: always()
        run: docker compose logs && docker compose down
